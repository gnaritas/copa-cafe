<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>og-src</title>
<style>
  html,body{margin:0;padding:0}
  .c{width:1200px;height:630px;background:#20100c;position:relative;overflow:hidden;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color:#f5ead6}
  .glow{position:absolute;width:1000px;height:1000px;border-radius:50%;right:-330px;top:-560px;
    background:radial-gradient(closest-side,rgba(217,162,74,.20),transparent 70%)}
  .glow2{position:absolute;width:760px;height:760px;border-radius:50%;left:-360px;bottom:-470px;
    background:radial-gradient(closest-side,rgba(70,95,55,.42),transparent 70%)}
  .inner{position:absolute;left:80px;top:132px;right:80px}
  .eyebrow{font-size:18px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#d9a24a;margin:0 0 20px}
  h1{font-size:112px;line-height:1.02;margin:0 0 26px;letter-spacing:-.01em;font-weight:700;text-transform:uppercase}
  h1 em{font-style:normal;color:#d9a24a}
  .chips{display:flex;gap:12px;margin:0 0 28px;flex-wrap:wrap}
  .chip{border:1.5px dashed;border-radius:8px;font-size:17px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:10px 16px}
  .c1{border-color:#aebcf0;color:#aebcf0}
  .c2{border-color:#e0a0bb;color:#e0a0bb}
  .c3{border-color:#e8b06a;color:#e8b06a}
  .sub{font-family:Georgia,"Times New Roman",serif;font-size:28px;line-height:1.45;color:#efe2c8;max-width:900px;margin:0 0 30px}
  .facts{font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#cbb894;margin:0}
  .stamp{position:absolute;right:86px;top:86px;width:180px;height:180px;color:#d9a24a;opacity:.9}
</style></head><body><div class="c">
  <div class="glow"></div><div class="glow2"></div>
  <svg class="stamp" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="10.8" stroke="currentColor" stroke-width="1.1" stroke-dasharray="2.4 2.1"/>
    <path d="M8 10.5h6.4v3.2a3.2 3.2 0 0 1-3.2 3.2h0a3.2 3.2 0 0 1-3.2-3.2z" stroke="currentColor" stroke-width="1.2"/>
    <path d="M14.4 11.2h1.3a1.3 1.3 0 0 1 0 2.6h-1.3" stroke="currentColor" stroke-width="1.2"/>
    <path d="M9.6 6.2c.7.8.7 1.6 0 2.4M12 5.6c.7.8.7 1.6 0 2.4" stroke="currentColor" stroke-width="1"/></svg>
  <div class="inner">
    <p class="eyebrow">New in Corpus Christi &middot; inside Echelon Performance Gym</p>
    <h1>CoPa <em>Caf&eacute;</em></h1>
    <div class="chips">
      <span class="chip c1">Blueberry + cardamom</span>
      <span class="chip c2">Fig + brown sugar</span>
      <span class="chip c3">Pumpkin + cookie butter</span>
    </div>
    <p class="sub">Espresso &middot; Matcha &middot; Chai &mdash; pick a base, pick a pairing.
      Plain cold brew for the purists.</p>
    <p class="facts">1133 County Rd 22 &middot; Mon&ndash;Fri 8&ndash;4 &middot; Sat 9&ndash;5 &middot; Sun closed</p>
  </div>
</div></body></html>
